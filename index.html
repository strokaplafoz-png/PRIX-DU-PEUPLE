<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Boutique</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#888);--btn:var(--tg-theme-button-color,#2481cc);--btx:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f2f2f5)}
  *{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:80px}
  header{padding:14px 16px;font-size:20px;font-weight:700}
  .tabs{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
  .tab{padding:8px 14px;border-radius:20px;background:var(--card);border:0;color:var(--tx);white-space:nowrap;font-size:14px}
  .tab.on{background:var(--btn);color:var(--btx)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
  .card{background:var(--card);border-radius:14px;overflow:hidden}
  .card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#ddd}
  .card div{padding:10px}.name{font-size:14px;font-weight:600}.price{color:var(--hint);margin:4px 0 8px}
  .add{width:100%;padding:8px;border:0;border-radius:10px;background:var(--btn);color:var(--btx);font-size:14px}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;background:var(--bg)}
  .bar button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--btn);color:var(--btx);font-size:16px;font-weight:600}
  #cart{display:none;padding:0 16px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--card)}
  .qty button{width:28px;height:28px;border:0;border-radius:8px;background:var(--card);color:var(--tx);font-size:16px}
  input,textarea{width:100%;padding:10px;margin-top:8px;border:1px solid var(--card);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px}
</style>
</head>
<body>
<header>🛍 Ma Boutique</header>

<div id="shop">
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="cart">
  <h3>Panier</h3>
  <div id="lines"></div>
  <h3 id="total"></h3>
  <input id="nom" placeholder="Nom et prénom">
  <input id="tel" placeholder="Téléphone">
  <textarea id="adr" rows="3" placeholder="Adresse de livraison"></textarea>
</div>

<div class="bar"><button id="main">Voir le panier</button></div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();

// ====== À MODIFIER : tes produits ======
const PRODUITS = [
  {id:1, cat:"Vêtements", nom:"T-shirt noir oversize", prix:25, img:"https://picsum.photos/seed/tshirt/400"},
  {id:2, cat:"Vêtements", nom:"Hoodie gris", prix:49, img:"https://picsum.photos/seed/hoodie/400"},
  {id:3, cat:"Montres",   nom:"Montre classique acier", prix:89, img:"https://picsum.photos/seed/watch1/400"},
  {id:4, cat:"Montres",   nom:"Montre sport", prix:69, img:"https://picsum.photos/seed/watch2/400"},
  {id:5, cat:"Casquettes",nom:"Casquette snapback", prix:22, img:"https://picsum.photos/seed/cap1/400"},
  {id:6, cat:"Casquettes",nom:"Casquette bob", prix:19, img:"https://picsum.photos/seed/cap2/400"},
];
const DEVISE = "€";
// =======================================

const cats = ["Tout", ...new Set(PRODUITS.map(p => p.cat))];
let cat = "Tout", panier = {}, vueCart = false;

function renderTabs(){
  tabs.innerHTML = cats.map(c => `<button class="tab ${c===cat?'on':''}" onclick="setCat('${c}')">${c}</button>`).join("");
}
function setCat(c){cat=c;renderTabs();renderGrid();}
function renderGrid(){
  grid.innerHTML = PRODUITS.filter(p => cat==="Tout"||p.cat===cat).map(p => `
    <div class="card"><img src="${p.img}" loading="lazy"><div>
      <div class="name">${p.nom}</div><div class="price">${p.prix} ${DEVISE}</div>
      <button class="add" onclick="add(${p.id})">Ajouter</button></div></div>`).join("");
}
function add(id){panier[id]=(panier[id]||0)+1;tg.HapticFeedback?.impactOccurred("light");updateBar();}
function chg(id,d){panier[id]=(panier[id]||0)+d;if(panier[id]<=0)delete panier[id];renderCart();updateBar();}
const total = () => Object.entries(panier).reduce((s,[id,q]) => s + PRODUITS.find(p=>p.id==id).prix*q, 0);
function updateBar(){
  const n = Object.values(panier).reduce((a,b)=>a+b,0);
  main.textContent = vueCart ? `Commander · ${total()} ${DEVISE}` : (n ? `Panier (${n}) · ${total()} ${DEVISE}` : "Panier vide");
}
function renderCart(){
  lines.innerHTML = Object.entries(panier).map(([id,q]) => {
    const p = PRODUITS.find(x=>x.id==id);
    return `<div class="row"><span>${p.nom}<br><small>${p.prix} ${DEVISE}</small></span>
      <span class="qty"><button onclick="chg(${id},-1)">−</button> ${q} <button onclick="chg(${id},1)">+</button></span></div>`;
  }).join("") || "<p>Ton panier est vide.</p>";
  document.getElementById("total").textContent = `Total : ${total()} ${DEVISE}`;
}
main.onclick = () => {
  if(!Object.keys(panier).length) return;
  if(!vueCart){vueCart=true;shop.style.display="none";cart.style.display="block";renderCart();updateBar();return;}
  if(!nom.value||!tel.value||!adr.value){tg.showAlert("Remplis nom, téléphone et adresse.");return;}
  const items = Object.entries(panier).map(([id,q]) => {const p=PRODUITS.find(x=>x.id==id);return {nom:p.nom,prix:p.prix,qty:q};});
  tg.sendData(JSON.stringify({items,total:total(),client:{nom:nom.value,tel:tel.value,adr:adr.value}}));
};
tg.BackButton.onClick(()=>{vueCart=false;cart.style.display="none";shop.style.display="block";tg.BackButton.hide();updateBar();});
const _m = main.onclick; main.addEventListener("click",()=>{if(vueCart)tg.BackButton.show();});

renderTabs();renderGrid();updateBar();
</script>
</body>
</html>
