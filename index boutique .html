<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Boutique</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEEF1; --card:#fff; --ink:#101820; --mute:#5d6672;
  --red:#E4002B; --tag:#FFD400; --r:14px;
  --disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;padding-bottom:100px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

header{padding:24px 18px 4px}
h1{font-family:var(--disp);font-weight:900;font-size:60px;line-height:.88;letter-spacing:-.01em;text-transform:uppercase}
header p{color:var(--mute);margin-top:10px;max-width:34ch}

nav{display:flex;gap:22px;padding:14px 18px 8px;overflow-x:auto;position:sticky;top:0;background:var(--paper);z-index:5;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font-family:var(--disp);font-weight:700;font-size:24px;padding:2px 0;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-pressed=true]{color:var(--ink);border-color:var(--red)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px;padding:12px 18px}
.p{display:block;width:100%}
.ph{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:#d5d9de}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.sticker{position:absolute;right:8px;bottom:8px;background:var(--tag);color:var(--ink);font-family:var(--disp);font-weight:900;font-size:26px;line-height:1;padding:6px 10px 5px;transform:rotate(-4deg);border-radius:4px;box-shadow:0 2px 0 rgba(16,24,32,.25)}
.p .n{margin-top:9px;font-weight:600}
.p .c{color:var(--mute);font-size:13px}

.bar{position:fixed;left:0;right:0;bottom:0;padding:24px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(236,238,241,0),var(--paper) 38%);transform:translateY(115%);transition:transform .25s;z-index:6}
.bar.on{transform:none}
.bar button{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:var(--r);padding:14px 18px;font-weight:600}
.bar b{font-family:var(--disp);font-size:26px;font-weight:900;line-height:1}

.veil{position:fixed;inset:0;background:rgba(16,24,32,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:11}
.sheet.on{transform:none}
.close{position:absolute;top:12px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);font-size:22px;text-align:center;line-height:38px;z-index:2}
.sheet .big{aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:#d5d9de;position:relative}
.sheet .big img{width:100%;height:100%;object-fit:cover;display:block}
.sheet h2{font-family:var(--disp);font-weight:900;font-size:36px;line-height:1;margin-top:14px;text-transform:uppercase}
.sheet .d{color:var(--mute);margin-top:8px}
.sizes{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.sizes button{min-width:50px;height:50px;border:2px solid var(--ink);border-radius:10px;font-weight:600;text-align:center;padding:0 12px}
.sizes button[aria-pressed=true]{background:var(--ink);color:#fff}
.cta{width:100%;margin-top:18px;background:var(--red);color:#fff;border-radius:var(--r);padding:16px;font-weight:600;font-size:16px;text-align:center}
.cta[disabled]{background:#c4c9d0}

.ticket h2{margin-top:0}
.l{display:flex;align-items:baseline;gap:8px;padding-top:14px}
.l .dots{flex:1;border-bottom:2px dotted #b4bac3;transform:translateY(-4px)}
.l .pr{font-weight:600}
.qty{display:flex;align-items:center;gap:10px;margin-top:6px;color:var(--mute);font-size:13px}
.qty button{width:34px;height:34px;border-radius:50%;background:var(--paper);color:var(--ink);font-size:18px;text-align:center}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;padding-top:14px;border-top:2px solid var(--ink)}
.tot b{font-family:var(--disp);font-weight:900;font-size:40px;line-height:1}
.vide{color:var(--mute);padding:18px 0 4px}
.note{color:var(--mute);font-size:13px;margin-top:10px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1 id="nom"></h1>
  <p id="slogan"></p>
</header>
<nav id="tabs" aria-label="Catégories"></nav>
<main class="grid" id="grid"></main>

<div class="bar" id="bar"><button onclick="ouvrirPanier()"><span id="barN"></span><b id="barT"></b></button></div>
<div class="veil" id="veil" onclick="fermer()"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>

<script>
/* ============ À MODIFIER ============ */
const CONFIG = {
  nom: "Prix du peuple",
  slogan: "Vêtements, montres et casquettes à petits prix. Tu choisis, la commande part dans la discussion avec nous.",
  contact: "TON_PSEUDO_TELEGRAM",   // ton @pseudo Telegram, sans le @
  devise: "€"
};
const TAILLES_HAUT = ["S", "M", "L", "XL"];
const PRODUITS = [
  {id:1, cat:"Vêtements",  nom:"T-shirt oversize noir", prix:25, img:"https://picsum.photos/seed/tshirt/600/750", desc:"Coton épais, coupe ample.", tailles:TAILLES_HAUT},
  {id:2, cat:"Vêtements",  nom:"Hoodie gris",           prix:49, img:"https://picsum.photos/seed/hoodie/600/750", desc:"Molleton intérieur, capuche doublée.", tailles:TAILLES_HAUT},
  {id:3, cat:"Montres",    nom:"Montre acier classique",prix:89, img:"https://picsum.photos/seed/watch1/600/750", desc:"Boîtier acier, bracelet métal."},
  {id:4, cat:"Montres",    nom:"Montre sport",          prix:69, img:"https://picsum.photos/seed/watch2/600/750", desc:"Étanche, bracelet silicone."},
  {id:5, cat:"Casquettes", nom:"Casquette snapback",    prix:22, img:"https://picsum.photos/seed/cap1/600/750",   desc:"Taille réglable."},
  {id:6, cat:"Casquettes", nom:"Bob",                   prix:19, img:"https://picsum.photos/seed/cap2/600/750",   desc:"Coton léger, taille unique."}
];
/* ================================== */

const tg = window.Telegram && window.Telegram.WebApp;
try { tg.ready(); tg.expand(); tg.setHeaderColor("#ECEEF1"); tg.setBackgroundColor("#ECEEF1"); } catch(e) {}

const $ = s => document.querySelector(s);
const D = CONFIG.devise;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cats = ["Tout", ...new Set(PRODUITS.map(p => p.cat))];
let cat = "Tout", cur = null, taille = null, panier = {};
try { panier = JSON.parse(localStorage.getItem("panier") || "{}"); } catch(e) {}
const save = () => { try { localStorage.setItem("panier", JSON.stringify(panier)); } catch(e) {} };

function lignes(){
  return Object.entries(panier).map(([k, q]) => {
    const [id, t] = k.split("|");
    const p = PRODUITS.find(x => String(x.id) === id);
    return p ? {k, p, t, q} : null;
  }).filter(Boolean);
}
const total = () => lignes().reduce((s, l) => s + l.p.prix * l.q, 0);
const count = () => lignes().reduce((s, l) => s + l.q, 0);

function renderTabs(){
  $("#tabs").innerHTML = cats.map(c =>
    `<button aria-pressed="${c === cat}" onclick="setCat('${c}')">${esc(c)}</button>`).join("");
}
function setCat(c){ cat = c; renderTabs(); renderGrid(); }
function renderGrid(){
  $("#grid").innerHTML = PRODUITS.filter(p => cat === "Tout" || p.cat === cat).map(p => `
    <button class="p" onclick="ouvrir(${p.id})">
      <div class="ph"><img src="${esc(p.img)}" alt="${esc(p.nom)}" loading="lazy"><span class="sticker">${p.prix} ${D}</span></div>
      <div class="n">${esc(p.nom)}</div>
      <div class="c">${esc(p.cat)}</div>
    </button>`).join("");
}
function renderBar(){
  const n = count();
  $("#bar").classList.toggle("on", n > 0 && !sheetOpen);
  $("#barN").textContent = n > 1 ? `Voir mon panier (${n} articles)` : "Voir mon panier (1 article)";
  $("#barT").textContent = `${total()} ${D}`;
}

let sheetOpen = false;
function montrer(html){
  $("#sheet").innerHTML = html;
  $("#sheet").scrollTop = 0;
  $("#veil").classList.add("on");
  $("#sheet").classList.add("on");
  sheetOpen = true; renderBar();
  try { tg.BackButton.show(); } catch(e) {}
}
function fermer(){
  $("#veil").classList.remove("on");
  $("#sheet").classList.remove("on");
  sheetOpen = false; renderBar();
  try { tg.BackButton.hide(); } catch(e) {}
}
try { tg.BackButton.onClick(fermer); } catch(e) {}

function ouvrir(id){
  cur = PRODUITS.find(p => p.id === id); taille = null;
  const tailles = cur.tailles ? `<div class="sizes" role="group" aria-label="Taille">${cur.tailles.map(t =>
    `<button aria-pressed="false" onclick="choisir('${t}',this)">${t}</button>`).join("")}</div>` : "";
  montrer(`
    <button class="close" onclick="fermer()" aria-label="Fermer">×</button>
    <div class="big"><img src="${esc(cur.img)}" alt="${esc(cur.nom)}"><span class="sticker">${cur.prix} ${D}</span></div>
    <h2>${esc(cur.nom)}</h2>
    <p class="d">${esc(cur.desc || "")}</p>
    ${tailles}
    <button class="cta" id="addBtn" onclick="ajouter()" ${cur.tailles ? "disabled" : ""}>${cur.tailles ? "Choisis une taille" : "Ajouter au panier"}</button>`);
}
function choisir(t, el){
  taille = t;
  document.querySelectorAll(".sizes button").forEach(b => b.setAttribute("aria-pressed", String(b === el)));
  const b = $("#addBtn"); b.disabled = false; b.textContent = `Ajouter au panier, taille ${t}`;
}
function ajouter(){
  const k = cur.id + "|" + (taille || "");
  panier[k] = (panier[k] || 0) + 1; save();
  try { tg.HapticFeedback.notificationOccurred("success"); } catch(e) {}
  fermer();
}

function ouvrirPanier(){
  const L = lignes();
  const corps = L.length ? L.map(l => `
    <div>
      <div class="l"><span>${esc(l.p.nom)}${l.t ? ` (${esc(l.t)})` : ""}</span><span class="dots"></span><span class="pr">${l.p.prix * l.q} ${D}</span></div>
      <div class="qty"><button onclick="chg('${l.k}',-1)" aria-label="Retirer un">−</button>${l.q}<button onclick="chg('${l.k}',1)" aria-label="Ajouter un">+</button></div>
    </div>`).join("") + `
    <div class="tot"><span>Total</span><b>${total()} ${D}</b></div>
    <button class="cta" onclick="commander()">Commander</button>
    <p class="note">Ton panier s'écrit tout seul dans un message pour nous. Il te reste à l'envoyer.</p>`
    : `<p class="vide">Ton panier est vide. Choisis un article pour commencer.</p>`;
  montrer(`<button class="close" onclick="fermer()" aria-label="Fermer" style="background:var(--paper)">×</button><div class="ticket"><h2 class="sheet-title" style="font-family:var(--disp);font-weight:900;font-size:36px;text-transform:uppercase;line-height:1">Ton ticket</h2>${corps}</div>`);
}
function chg(k, d){
  panier[k] = (panier[k] || 0) + d;
  if (panier[k] <= 0) delete panier[k];
  save(); ouvrirPanier();
  if (!count()) { renderBar(); }
}

function alerte(m){ try { tg.showAlert(m); } catch(e) { alert(m); } }
function commander(){
  const user = CONFIG.contact.replace("@", "").trim();
  if (!user || user === "TON_PSEUDO_TELEGRAM") { alerte("Le pseudo Telegram de la boutique n'est pas encore renseigné."); return; }
  const L = lignes().map(l => `- ${l.q} x ${l.p.nom}${l.t ? ` (${l.t})` : ""} : ${l.p.prix * l.q} ${D}`).join("\n");
  const msg = `Bonjour, je veux commander :\n${L}\n\nTotal : ${total()} ${D}`;
  const url = `https://t.me/${user}?text=${encodeURIComponent(msg)}`;
  if (tg && tg.initData) tg.openTelegramLink(url); else window.open(url, "_blank");
}

$("#nom").textContent = CONFIG.nom;
$("#slogan").textContent = CONFIG.slogan;
document.title = CONFIG.nom;
renderTabs(); renderGrid(); renderBar();
</script>
</body>
</html>
